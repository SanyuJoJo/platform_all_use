core:
  # 铜锁 openssl 路径。留空则按平台自动解析：
  #   <coreRoot>/libs/openssl/<os>-<arch>/openssl(.exe)
  tongsuo_openssl_bin: ""
  tongsuo_min_version: "8.5.0"
  whitebox_bin: "bin/whitebox_sm4"
  timeout_ms: 5000
  max_concurrency: 8
  # 相对路径基于 coreRoot
  data_dir: "data"
  log_dir: "logs"
  tmp_dir: "tmp"
  master_key_path: "data/keys/master.key"
  audit_log_file: "logs/audit.jsonl"
