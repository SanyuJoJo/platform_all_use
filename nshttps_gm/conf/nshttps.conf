# ============================================================
# nshttps_gm 统一入口配置（自动生成，勿手改）
# 监听 8443：国际 TLS + 国密 NTLS 双协议共存（单向认证）
# 反代目标：127.0.0.1:8000
# ============================================================
worker_processes auto;
pid /code/platform_all_use/nshttps_gm/pid/nginx.pid;
error_log /code/platform_all_use/nshttps_gm/logs/error.log warn;

events {
    worker_connections 2048;
}

http {
    include       /code/platform_all_use/nshttps_gm/tengine-3.1.0/conf/mime.types;
    default_type  application/octet-stream;
    access_log    /code/platform_all_use/nshttps_gm/logs/access.log;
    sendfile      on;

    # ---- 国际 TLS：标准 ECC(P-256) 证书 ----
    ssl_certificate      /code/platform_all_use/nshttps_gm/certs/server/international.crt;
    ssl_certificate_key  /code/platform_all_use/nshttps_gm/certs/server/international.key;

    # ---- 国密 NTLS：SM2 双证书 ----
    ssl_sign_certificate     /code/platform_all_use/nshttps_gm/certs/server/server.crt;
    ssl_sign_certificate_key /code/platform_all_use/nshttps_gm/certs/server/server.key;
    ssl_enc_certificate      /code/platform_all_use/nshttps_gm/certs/server/server_enc.crt;
    ssl_enc_certificate_key  /code/platform_all_use/nshttps_gm/certs/server/server_enc.key;
    ssl_trusted_certificate  /code/platform_all_use/nshttps_gm/certs/ca/sm2-root.crt;

    # 标准 TLS 协议与套件（国际通道）
    ssl_protocols  TLSv1.2 TLSv1.3;
    ssl_ciphers    HIGH:!aNULL:!MD5:!RC4:!kRSA:!kSRP:!kPSK:@STRENGTH;
    ssl_prefer_server_ciphers on;

    # 国密 NTLS 通道开关（与标准 TLS 在同一 listen 上共存）
    enable_ntls on;

    # 会话
    ssl_session_cache   shared:NSG:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;

    server {
        listen       8443 ssl;
        server_name  localhost;

        # 单向认证：服务端只出示证书，不校验客户端证书
        # （如需双向认证，放开下面两行并提供客户端 CA）
        # ssl_client_certificate /code/platform_all_use/nshttps_gm/certs/ca/sm2-root.crt;
        # ssl_verify_client on;

        # 统一入口反代：内部服务全部走 127.0.0.1
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host              $host;
            proxy_set_header X-Real-IP         $remote_addr;
            proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }
    }
}
